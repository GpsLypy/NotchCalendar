name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.1.2"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Build release archive
        run: Scripts/create_release.sh "${RELEASE_VERSION#v}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${RELEASE_VERSION#v}" \
            "dist/NotchCalendar-${RELEASE_VERSION#v}-macos.zip" \
            "dist/NotchCalendar-${RELEASE_VERSION#v}-macos.dmg" \
            --generate-notes \
            --title "Notch Calendar v${RELEASE_VERSION#v}"
