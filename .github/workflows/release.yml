name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build release archive
        run: Scripts/create_release.sh "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/NotchCalendar-${GITHUB_REF_NAME#v}-macos.zip" \
            --generate-notes \
            --title "Notch Calendar ${GITHUB_REF_NAME}"
